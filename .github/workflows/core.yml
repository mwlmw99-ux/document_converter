name: core

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Flutter analyze
        working-directory: apps/flutter_app
        run: flutter analyze

  android-build:
    name: Android ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: debug-apk
            build-command: flutter build apk --debug
            artifact-path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          - artifact: release-apk
            build-command: flutter build apk --release
            artifact-path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          - artifact: release-aab
            build-command: flutter build appbundle --release
            artifact-path: apps/flutter_app/build/app/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Generate Android project when missing
        working-directory: apps/flutter_app
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --project-name document_converter .; fi
      - name: Flutter pub get
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Build Android artifact
        working-directory: apps/flutter_app
        run: ${{ matrix.build-command }}
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
