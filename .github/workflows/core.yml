name: core

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Flutter analyze
        working-directory: apps/flutter_app
        run: flutter analyze
      - name: Flutter test
        working-directory: apps/flutter_app
        run: flutter test

  android-build:
    name: Android ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: debug-apk
            build-command: flutter build apk --debug
            artifact-path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          - artifact: release-apk
            build-command: flutter build apk --release
            artifact-path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          - artifact: release-aab
            build-command: flutter build appbundle --release
            artifact-path: apps/flutter_app/build/app/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android project
        working-directory: apps/flutter_app
        run: flutter create --platforms=android --project-name document_converter --org com.documentconverter .
      - name: Configure Android app SDK versions
        working-directory: apps/flutter_app/android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          candidates = [Path('app/build.gradle.kts'), Path('app/build.gradle')]
          path = next((p for p in candidates if p.is_file()), None)
          if path is None:
              raise SystemExit('Android app Gradle file not found')
          text = path.read_text()
          if path.suffixes[-2:] == ['.gradle', '.kts']:
              text = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', text)
              text = re.sub(r'compileSdkVersion\s*[^\n]+', 'compileSdk = 36', text)
              if 'compileSdk = 36' not in text:
                  raise SystemExit('Could not set compileSdk = 36 in Kotlin DSL')
          else:
              text = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', text)
              text = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdkVersion 36', text)
              if 'compileSdkVersion 36' not in text:
                  raise SystemExit('Could not set compileSdkVersion 36 in Groovy')
          text = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', text)
          text = re.sub(r'targetSdkVersion\s+[^\n]+', 'targetSdkVersion 36', text)
          path.write_text(text)
          print(f'Configured {path}')
          PYTHON
      - name: Verify compileSdk 36
        working-directory: apps/flutter_app/android/app
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build.gradle.kts ]; then
            grep -nE '^\s*compileSdk\s*=\s*36\s*$' build.gradle.kts
          elif [ -f build.gradle ]; then
            grep -nE '^\s*compileSdkVersion\s+36\s*$' build.gradle
          else
            echo 'Android app Gradle file missing' >&2; exit 1
          fi
      - name: Flutter pub get
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Verify toolchain
        run: java -version && flutter doctor -v
      - name: Build Android artifact
        working-directory: apps/flutter_app
        run: ${{ matrix.build-command }}
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  desktop-build:
    name: Flutter ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Generate desktop project when missing
        working-directory: apps/flutter_app
        shell: bash
        run: |
          if [ ! -d "${{ matrix.platform }}" ]; then flutter create --platforms=${{ matrix.platform }} --project-name document_converter .; fi
      - name: Flutter pub get
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Build desktop
        working-directory: apps/flutter_app
        run: flutter build ${{ matrix.platform }}
