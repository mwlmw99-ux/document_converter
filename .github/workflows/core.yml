name: core

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Flutter analyze
        working-directory: apps/flutter_app
        run: flutter analyze
      - name: Flutter test
        working-directory: apps/flutter_app
        run: flutter test

  android-build:
    name: Android ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: debug-apk
            build-command: flutter build apk --debug
            artifact-path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          - artifact: release-apk
            build-command: flutter build apk --release
            artifact-path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          - artifact: release-aab
            build-command: flutter build appbundle --release
            artifact-path: apps/flutter_app/build/app/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android project
        working-directory: apps/flutter_app
        run: flutter create --platforms=android --project-name document_converter --org com.documentconverter .
      - name: Pin Android Gradle settings
        working-directory: apps/flutter_app/android
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ]; then
            sed -i -E "s#com\.android\.tools\.build:gradle:[^'\"]+#com.android.tools.build:gradle:8.6.1#g" settings.gradle || true
            sed -i -E "s#org\.jetbrains\.kotlin\.android[^\n]*version[^'\"]*#org.jetbrains.kotlin.android version '2.0.21'#g" settings.gradle || true
          elif [ -f settings.gradle.kts ]; then
            sed -i -E 's#com\.android\.tools\.build:gradle:[^" ]+#com.android.tools.build:gradle:8.6.1#g' settings.gradle.kts || true
          else
            echo "No Gradle settings file found" >&2
            exit 1
          fi
          for f in ../android/app/build.gradle ../android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Line)?[[:space:]]*(=)?[[:space:]]*[^;]+/compileSdk\1 = 36/g; s/targetSdk(Line)?[[:space:]]*(=)?[[:space:]]*[^;]+/targetSdk\1 = 36/g' "$f"
            fi
          done
      - name: Flutter pub get
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Verify toolchain
        run: java -version && flutter doctor -v
      - name: Build Android artifact
        working-directory: apps/flutter_app
        run: ${{ matrix.build-command }}
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  desktop-build:
    name: Flutter ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Generate desktop project when missing
        working-directory: apps/flutter_app
        shell: bash
        run: |
          if [ ! -d "${{ matrix.platform }}" ]; then flutter create --platforms=${{ matrix.platform }} --project-name document_converter .; fi
      - name: Flutter pub get
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Build desktop
        working-directory: apps/flutter_app
        run: flutter build ${{ matrix.platform }}
